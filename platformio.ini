; ============================================================================
;  Aptatio ECU 50cc 2T  -  build PlatformIO
;
;  Layout : shifter.ino a la racine (Arduino IDE) + modules dans src/<domaine>/.
;  src_dir = .  -> PlatformIO compile shifter.ino + toute l'arborescence src/.
;
;  Avant le 1er build : copier src/persistence/secrets.example.h
;  vers src/persistence/secrets.h et y mettre un secret HMAC unique (BUILD.md).
; ============================================================================

[platformio]
src_dir = .

[env:esp32dev]
platform  = espressif32@6.9.0      ; Arduino-ESP32 2.0.x / ESP-IDF 4.4
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

build_flags =
  -Wall
; Decommenter pour imprimer les cles de licence attendues au boot (usine) :
; -DLICENSE_PRINT_KEYS_ON_BOOT
; Decommenter UNIQUEMENT pour un build de test sans secrets.h :
; -DALLOW_INSECURE_DEFAULT_SECRET

lib_deps =
  ESP32Async/AsyncTCP
  ESP32Async/ESPAsyncWebServer

; ---------------------------------------------------------------------------
;  Environnement SIMULATION Wokwi :
;    pio run -e wokwi
;  -> WiFi/web desactives (rapidite), licence PRO, faux moteur, 6 blinks au boot.
;  wokwi.toml pointe vers .pio/build/wokwi/firmware.{bin,elf}
;
;  Regle la simu ICI (aucun moniteur serie necessaire), puis :
;    pio run -e wokwi   +   redemarre le simulateur Wokwi.
;
;  IGNITION_SIM_SCALE=<n>  multiplie la duree de TOUTES les coupures
;                          40 -> 50 ms de cut = 2 s de LED ; 100 -> 5 s ; 1 -> reel
;  SIM_SHIFT_CUT_MS=<ms>   force la duree du cut quickshifter (0 = defaut)
;  SIM_FREEZE=<0|1>        1 -> faux moteur fige : la LED ne repond qu'aux boutons
;  SIM_TIER=<0|1|2>        licence forcee au boot : 0 BASIC / 1 TRACK / 2 PRO
;                          (test du bridage ; modifiable a chaud : 'key <cle>')
; ---------------------------------------------------------------------------
[env:wokwi]
extends     = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -DWOKWI_SIM
  -DIGNITION_SIM_SCALE=2
  -DSIM_SHIFT_CUT_MS=100
  -DSIM_FREEZE=1
  -DSIM_TIER=1

; ---------------------------------------------------------------------------
;  Environnement PROVISIONING USINE :
;    1) pio run -e factory -t upload           (flashe la carte + console serie)
;    2) python tools/provision.py --port COMx --tier TRACK --order 1234
;    3) pio run -e esp32dev -t upload          (firmware de prod ; garde la NVS)
;  La console serie (MAC? / KEY <cle> / WIPE) n'existe QUE dans ce build.
; ---------------------------------------------------------------------------
[env:factory]
extends     = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DFACTORY_TOOLS
